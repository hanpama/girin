type User implements Node {
  id: ID!
  orders(first: Int, after: Cursor, last: Int, before: Cursor, offset: Int, filters: [OrderFilter!]): OrderConnection!
}

scalar UserID

input UserFilter {
  id: UserIDFilter
  q: String
}

input UserIDFilter {
  eq: UserID
  in: [UserID!]
}

type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
}

type UserEdge {
  node: User
  cursor: Cursor!
}

type Order implements Node & Bookmarkable {
  id: ID!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  orderer: User!
  status: OrderStatus!
  destination: String!
  products: [OrderProduct!]!
  currency: Currency!
  taxRate: Decimal!
  productsSubtotalAmount: Decimal!
  shippingAmount: Decimal!
  taxAmount: Decimal!
  totalAmount: Decimal!
  viewerHasBookmarked: Boolean!
}

enum OrderStatus {
  DRAFT
  PENDING
  CONFIRMED
  CANCELLED
  SHIPPED
  DELIVERED
}

type OrderProduct {
  description: String!
  quantity: Int!
  unitPrice: Decimal!
  amount: Decimal!
}

input OrderProductInput {
  description: String
  quantity: Int = 1
  unitPrice: Decimal
  amount: Decimal
}

scalar OrderID

input OrderFilter {
  id: OrderIDFilter
  q: String
}

input OrderIDFilter {
  eq: OrderID
  in: [OrderID!]
}

type OrderConnection {
  edges: [OrderEdge!]!
  pageInfo: PageInfo!
}

type OrderEdge {
  node: Order
  cursor: Cursor!
}

input OrderCreateInDraftInput {
  products: [OrderProductInput!]! = [{description: "Example Product", unitPrice: 199}]
  currency: Currency! = USD
  taxRate: Decimal! = 0.1
  shippingAmount: Decimal! = 0
  destination: String! = "PUKRKJE"
}

type OrderCreateInDraftPayload {
  orderCreatedInDraft: Order!
}

"""
  An object with an ID
"""
interface Node {
  """
    The id of the object.
  """
  id: ID!
}

"""
  Information about pagination in a connection.
"""
type PageInfo {
  """
    When paginating forwards, are there more items?
  """
  hasNextPage: Boolean!
  """
    When paginating backwards, are there more items?
  """
  hasPreviousPage: Boolean!
  """
    When paginating backwards, the cursor to continue.
  """
  startCursor: Cursor
  """
    When paginating forwards, the cursor to continue.
  """
  endCursor: Cursor
}

scalar Cursor

type Query {
  version: String!
  """
    Fetches an object given its ID
  """
  node(id: ID!): Node
  """
    Fetches objects given their IDs
  """
  nodes(ids: [ID!]!): [Node]!
  user(id: UserID!): User!
  userConnection(first: Int, after: Cursor, last: Int, before: Cursor, offset: Int, filter: UserFilter): UserConnection!
  viewer: User
  order(id: OrderID!): Order!
  orderConnection(first: Int, after: Cursor, last: Int, before: Cursor, offset: Int, filters: [OrderFilter!]): OrderConnection!
}

type Mutation {
  version: String!
  bookmarkBookmarkable(input: BookmarkableBookmarkInput!): BookmarkableBookmarkPayload
  unbookmarkBookmarkable(input: BookmarkableUnbookmarkInput!): BookmarkableUnbookmarkPayload
  orderCreateInDraft(input: OrderCreateInDraftInput!): OrderCreateInDraftPayload
}

"""
  An [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) encoded UTC date string.
"""
scalar Timestamp

"""
  Decimal floating point partially implmenting http://speleotrove.com/decimal/decarith.html
"""
scalar Decimal

scalar TypeID
