type Bookmark implements Node {
  id: ID!
  createdAt: Timestamp!
  bookmarker: User!
  bookmarkable: Bookmarkable!
}

scalar BookmarkID

input BookmarkIDFilter {
  eq: BookmarkID
  in: [BookmarkID!]
}

input BookmarkFilter {
  id: BookmarkIDFilter
  bookmarkableId: BookmarkableIDFilter
  bookmarkerId: UserIDFilter
}

type BookmarkConnection {
  edges: [BookmarkEdge!]!
  pageInfo: PageInfo!
}

type BookmarkEdge {
  node: Bookmark
  cursor: Cursor!
}

interface Bookmarkable implements Node {
  id: ID!
  viewerHasBookmarked: Boolean!
  bookmarks(first: Int, after: Cursor, last: Int, before: Cursor, filters: [BookmarkFilter!]): BookmarkConnection!
}

scalar BookmarkableID

input BookmarkableIDFilter {
  eq: BookmarkableID
  in: [BookmarkableID!]
}

input BookmarkableBookmarkInput {
  bookmarkableId: BookmarkableID!
}

type BookmarkableBookmarkPayload {
  bookmarkableBookmarked: Bookmarkable!
}

input BookmarkableUnbookmarkInput {
  bookmarkableId: BookmarkableID!
}

type BookmarkableUnbookmarkPayload {
  bookmarkableUnbookmarked: Bookmarkable!
}

